<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carrusel de Imágenes</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: linear-gradient(160deg, #fff5f0 0%, #fde8f0 40%, #ede8f8 100%);
      min-height: 100vh;
    }

    .section-carousel {
      width: 100%;
      padding: 48px 0;
    }

    .section-carousel__inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 24px;
    }

    .section-carousel__titulo {
      text-align: center;
      font-size: clamp(1.25rem, 3vw, 1.75rem);
      font-weight: 700;
      color: #3a2a4d;
      margin-bottom: 28px;
      letter-spacing: -0.01em;
    }

    .carousel {
      position: relative;
      width: 100%;
    }

    .carousel__track-wrapper {
      overflow: hidden;
      border-radius: 20px;
      box-shadow: 0 8px 40px rgba(180, 120, 160, 0.18);
      transform: translateZ(0);
    }

    .carousel__track {
      display: flex;
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      will-change: transform;
    }

    .carousel__slide {
      flex: 0 0 100%;
      min-width: 100%;
      position: relative;
      aspect-ratio: 3 / 4;
      background: linear-gradient(135deg, #fce4ec 0%, #f3e5f5 50%, #ede7f6 100%);
      backface-visibility: hidden;
    }

    .carousel__slide img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      backface-visibility: hidden;
    }

    .carousel__btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 10;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.85);
      box-shadow: 0 4px 16px rgba(180, 120, 160, 0.25);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.2s;
    }

    .carousel__btn:hover {
      background: #fff;
      transform: translateY(-50%) scale(1.08);
    }

    .carousel__btn--prev { left: 12px; }
    .carousel__btn--next { right: 12px; }

    .carousel__btn svg {
      width: 20px;
      height: 20px;
      color: #c04878;
      flex-shrink: 0;
    }

    .carousel__dots {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 16px;
    }

    .carousel__dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(192, 72, 120, 0.25);
      border: none;
      cursor: pointer;
      padding: 0;
      transition: background 0.2s, transform 0.2s;
    }

    .carousel__dot.active {
      background: #c04878;
      transform: scale(1.3);
    }

    .carousel__counter {
      text-align: center;
      margin-top: 10px;
      font-size: 0.78rem;
      color: #8a6a8a;
    }
  </style>
</head>
<body>

  <section class="section-carousel">
    <div class="section-carousel__inner">

      <h2 class="section-carousel__titulo">
        <!-- Reemplazá este título por el tuyo -->
        Galería de creaciones 🧶
      </h2>

      <div class="carousel">

        <div class="carousel__track-wrapper">
          <div class="carousel__track" id="carousel-track">

            <div class="carousel__slide">
              <img src="imagen-1.jpg" alt="Imagen 1" />
            </div>
            <div class="carousel__slide">
              <img src="imagen-2.jpg" alt="Imagen 2" />
            </div>
            <div class="carousel__slide">
              <img src="imagen-3.jpg" alt="Imagen 3" />
            </div>
            <div class="carousel__slide">
              <img src="imagen-4.jpg" alt="Imagen 4" />
            </div>
            <div class="carousel__slide">
              <img src="imagen-5.jpg" alt="Imagen 5" />
            </div>
            <div class="carousel__slide">
              <img src="imagen-6.jpg" alt="Imagen 6" />
            </div>
            <div class="carousel__slide">
              <img src="imagen-7.jpg" alt="Imagen 7" />
            </div>

          </div>
        </div>

        <button class="carousel__btn carousel__btn--prev" id="btn-prev" aria-label="Anterior">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
          </svg>
        </button>

        <button class="carousel__btn carousel__btn--next" id="btn-next" aria-label="Siguiente">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
          </svg>
        </button>

      </div>

      <div class="carousel__dots" id="carousel-dots"></div>
      <p class="carousel__counter" id="carousel-counter">1 / 7</p>

    </div>
  </section>

  <script>
    const track   = document.getElementById('carousel-track');
    const dotsEl  = document.getElementById('carousel-dots');
    const counter = document.getElementById('carousel-counter');
    const total   = 7;
    let current   = 0;

    for (let i = 0; i < total; i++) {
      const dot = document.createElement('button');
      dot.className = 'carousel__dot' + (i === 0 ? ' active' : '');
      dot.setAttribute('aria-label', `Ir a imagen ${i + 1}`);
      dot.addEventListener('click', () => goTo(i));
      dotsEl.appendChild(dot);
    }

    function goTo(index) {
      current = (index + total) % total;
      track.style.transform = `translateX(-${current * 100}%)`;
      document.querySelectorAll('.carousel__dot').forEach((d, i) =>
        d.classList.toggle('active', i === current)
      );
      counter.textContent = `${current + 1} / ${total}`;
    }

    document.getElementById('btn-prev').addEventListener('click', () => goTo(current - 1));
    document.getElementById('btn-next').addEventListener('click', () => goTo(current + 1));

    let startX = 0;
    track.addEventListener('touchstart', e => { startX = e.touches[0].clientX; }, { passive: true });
    track.addEventListener('touchend', e => {
      const diff = startX - e.changedTouches[0].clientX;
      if (Math.abs(diff) > 40) goTo(diff > 0 ? current + 1 : current - 1);
    });
  </script>

</body>
</html>
